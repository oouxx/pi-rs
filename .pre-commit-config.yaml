# Pre-commit hooks for pi-rs.
#
# Enable once per clone:
#   pre-commit install
#
# Runs `cargo fmt` (workspace-wide) before a commit that stages Rust files.
# Note: the hook formats the whole workspace, so it may rewrite files outside
# the current change. When that happens pre-commit reports "files were modified
# by this hook" and aborts the commit; review the formatting diff, `git add -u`,
# and commit again.

repos:
  - repo: local
    hooks:
      - id: cargo-fmt
        name: cargo fmt
        entry: cargo fmt
        language: system
        types: [rust]
        pass_filenames: false
