# Pre-commit hooks for pi-rs.
#
# Enable once per clone:
#   pre-commit install
#
# Runs `cargo fmt --all -- --check` before a commit that stages Rust files.
# The check is workspace-wide and non-destructive: if any file is not rustfmt
# clean the hook fails and lists the files; run `cargo fmt --all`, review the
# diff, and commit again.

repos:
  - repo: local
    hooks:
      - id: cargo-fmt
        name: cargo fmt --all -- --check
        entry: cargo fmt --all -- --check
        language: system
        types: [rust]
        pass_filenames: false
