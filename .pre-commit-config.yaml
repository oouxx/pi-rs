# Pre-commit hooks for pi-rs.
#
# Enable once per clone:
#   pre-commit install
#
# The rustfmt hook formats only the Rust files staged for this commit and
# re-stages them. It deliberately does not run `cargo fmt --all`: parts of the
# existing tree are not byte-identical to the current rustfmt output, and a
# workspace-wide format would silently rewrite unrelated files on every commit.

repos:
  - repo: local
    hooks:
      - id: rustfmt-staged
        name: rustfmt (staged Rust files)
        description: Format staged .rs files with rustfmt and re-stage them.
        entry: scripts/pre-commit-fmt.sh
        language: system
        files: '\.rs$'
        pass_filenames: false
