[workspace]

members = [
    "crates/pi-agent-core",
    "crates/pi-ai",
    "crates/pi-extension-api",
    "crates/pi-coding-agent",
    "crates/pi-extensions",
    "crates/pi-cli",
    "crates/xtask",
]


resolver = "2"
# Centralized dependency declarations. Member crates inherit via
# `dep = { workspace = true }` (optionally adding crate-specific features), so
# versions are managed in one place. Deps that differ meaningfully across
# crates (e.g. reqwest's feature/default-flags matrix) stay per-crate.

[workspace.package]
version = "1.82.12"
edition = "2021"
rust-version = "1.80.0"
license = "MIT"
authors = ["oouxx"]
[workspace.dependencies]
# Internal crates
pi-ai = { path = "crates/pi-ai" }
pi-agent-core = { path = "crates/pi-agent-core" }
pi-extension-api = { path = "crates/pi-extension-api" }
pi-coding-agent = { path = "crates/pi-coding-agent" }
pi-extensions = { path = "crates/pi-extensions" }

# Shared external dependencies
crossterm = { version = "0.28", features = ["event-stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1" }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
async-trait = "0.1"
futures = "0.3"
regex = "1"
tokio-stream = "0.1"
tokio-util = { version = "0.7", features = ["compat"] }
uuid = { version = "1", features = ["v4", "v7", "serde"] }
tempfile = "3"

[workspace.lints.clippy]
all = "warn"
# pedantic = "warn"
# nursery = "warn"
unwrap_used = "warn"       # 生产代码禁止裸 unwrap
expect_used = "warn"
todo = "warn"
dbg_macro = "warn"
