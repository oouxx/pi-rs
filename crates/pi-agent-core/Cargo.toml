[package]
name = "pi-agent-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "General-purpose agent with transport abstraction, state management, and attachment support (Rust port of @earendil-works/pi-agent-core)"

[dependencies]
pi-ai = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["full"] }
uuid = { workspace = true, features = ["v7"] }
chrono = { workspace = true }
thiserror = { workspace = true }
async-trait = { workspace = true }
futures = { workspace = true }
tokio-stream = { workspace = true }
tokio-util = "0.7"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tempfile = { workspace = true }
serde_yaml = "0.9"
regex = { workspace = true }
schemars = { version = "0.8", optional = true, features = ["derive"] }

[features]
default = ["extraction"]
extraction = ["dep:schemars"]

[dev-dependencies]

[lints]
workspace = true
