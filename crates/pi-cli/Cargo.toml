[package]
name = "pi-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "CLI binary for pi-coding-agent — argument parsing, run orchestration, and terminal output"

# Binary name is `pi-rs` (crate stays `pi-cli` for dependency/tooling
# references). Build with `cargo build -p pi-cli` → target/debug/pi-rs.
[[bin]]
name = "pi-rs"
path = "src/main.rs"

[dependencies]
pi-coding-agent = { workspace = true }
pi-extensions = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["full"] }
colored = "3"
base64 = "0.22"
image = "0.25"

[dev-dependencies]
tempfile = { workspace = true }

[features]
# Interactive TUI is the default app mode for a TTY (no args) — matching
# TS `resolveAppMode`. Build without it via `--no-default-features`.
default = ["interactive"]
interactive = ["pi-coding-agent/interactive"]


[lints]
workspace = true