[package]
name = "pi-coding-agent"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Coding agent CLI with read/bash/edit/write tools and session management (Rust port of @earendil-works/pi-coding-agent)"


[dependencies]
pi-agent-core = { workspace = true }
pi-extension-api = { workspace = true }
pi-extensions = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = "0.9"
tokio = { workspace = true, features = ["full"] }
uuid = { workspace = true }
chrono = { workspace = true }
thiserror = { workspace = true }
async-trait = { workspace = true }
futures = { workspace = true }
tokio-util = { workspace = true }
# ACP (Agent Client Protocol) — agent-side server for Zed / ACP-compatible editors.
# The `unstable` feature enables session/model/config-option methods used by
# modern ACP clients (Zed, JetBrains, etc.).
agent-client-protocol = { version = "0.10.4", features = ["unstable"] }
glob = "0.3"
# gitignore-aware directory walking (ripgrep's walker): respects .gitignore /
# .ignore / .git/info/exclude and stops parent rules at nested git repo
# boundaries, matching the TS find tool's fd-based behavior (pi#5960).
ignore = "0.4"
regex = { workspace = true }
dirs = "6"
similar = "2"
unicode-normalization = "0.1"
url = "2"
fs2 = "0.4"
base64 = "0.22"
# Process-group kill for the bash tool (kill the whole tree, matching TS
# `killProcessTree` which sends SIGKILL to -pid on Unix).
[target.'cfg(unix)'.dependencies]
libc = "0.2"
# reqwest bumped 0.11 -> 0.12 to align with pi-ai / pi-agent-core (usage is
# limited to Client::builder + get/send/json, which is stable across the bump).
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
# MCP (Model Context Protocol) client — lets ACP sessions call external MCP
# servers' tools (stdio + streamable HTTP). Default-on.
rmcp = { version = "1.8", optional = true, default-features = false, features = [
  "client",
  "transport-child-process",
  "which-command",
  "transport-streamable-http-client-reqwest",
] }

[features]
# Interactive TUI mode. The pi-tui / crossterm dependencies are currently removed
# because pi-tui's ratatui 0.29 hard-pins unicode-width =0.2.0. Re-add once pi-tui
# upgrades to ratatui 0.30. The interactive mode code stays gated behind
# `#[cfg(feature = "interactive")]` and is inert until then.
default = ["mcp"]
interactive = []
# MCP (Model Context Protocol) client support (stdio + streamable HTTP).
# Default-on. Disabling removes the rmcp dependency and the ACP MCP wiring.
mcp = ["dep:rmcp"]

[dev-dependencies]
tempfile = { workspace = true }


[lints]
workspace = true
