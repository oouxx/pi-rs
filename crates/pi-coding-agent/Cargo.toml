[package]
name = "pi-coding-agent"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Coding agent CLI with read/bash/edit/write tools and session management (Rust port of @earendil-works/pi-coding-agent)"


[dependencies]
pi-agent-core = { workspace = true }
pi-extension-api = { workspace = true }
pi-extensions = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = "0.9"
tokio = { workspace = true, features = ["full"] }
uuid = { workspace = true }
chrono = { workspace = true }
thiserror = { workspace = true }
async-trait = { workspace = true }
futures = { workspace = true }
tokio-util = { workspace = true }
# ACP (Agent Client Protocol) — agent-side server for Zed / ACP-compatible editors.
# The `unstable` feature enables session/model/config-option methods used by
# modern ACP clients (Zed, JetBrains, etc.).
agent-client-protocol = { version = "0.10.4", features = ["unstable"] }
glob = "0.3"
regex = { workspace = true }
dirs = "6"
similar = "2"
unicode-normalization = "0.1"
url = "2"
fs2 = "0.4"
# reqwest bumped 0.11 -> 0.12 to align with pi-ai / pi-agent-core (usage is
# limited to Client::builder + get/send/json, which is stable across the bump).
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
# JS/TS runtime for loading pi extensions at runtime (V8 + swc transpile).
# Feature-gated so the default build stays light; see EXTENSION_LOADING_FEASIBILITY.md.
deno_core = { workspace = true, optional = true }
deno_ast = { version = "0.53", optional = true, features = ["transpiling"] }
deno_error = { version = "0.7", optional = true }

[features]
# Interactive TUI mode. The pi-tui / crossterm dependencies are currently removed
# because pi-tui's ratatui 0.29 hard-pins unicode-width =0.2.0. Re-add once pi-tui
# upgrades to ratatui 0.30. The interactive mode code stays gated behind
# `#[cfg(feature = "interactive")]` and is inert until then.
default = []
interactive = []
# Embeds V8 (via deno_core) + swc (via deno_ast) to load TS/JS extensions
# at runtime, mirroring TS loader.ts. Heavy build dependency — opt-in.
js-runtime = ["dep:deno_core", "dep:deno_ast", "dep:deno_error"]

[dev-dependencies]
tempfile = { workspace = true }


[lints]
workspace = true
