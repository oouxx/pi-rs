[package]
name = "xai-ratatui-textarea"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "Vendored from xai-org/grok-build crates/codegen/xai-ratatui-textarea (multiline text editor widget)"

# Adapted from upstream: ratatui 0.29, workspace-relative deps pinned to
# crates.io versions; the upstream `examples/` demo is not vendored.

[dependencies]
crossterm = { version = "0.28", features = ["event-stream", "bracketed-paste"] }
ratatui = { version = "0.29", features = ["crossterm", "unstable-widget-ref"] }
ratatui-core = "0.1"
textwrap = "0.16"
tracing = { version = "0.1", optional = true }
tui-scrollbar = "0.2"
unicode-segmentation = "1.12.0"
unicode-width = "0.2"

[dev-dependencies]
arboard = "3.6"
fuzzy-matcher = "0.3.7"
ignore = "0.4"
itertools = "0.14"
pretty_assertions = "1"
rand = "0.9"

[features]
default = []
debug-logs = ["dep:tracing"]
